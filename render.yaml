services:
  - type: web
    name: enterprise-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MOCK_AI
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-db
          property: connectionString

databases:
  - name: enterprise-ai-db
    plan: free
    region: oregon
    databaseName: enterprise_ai_ops
    user: postgres

