version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database with pgvector Extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise_ai_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enterprise-net

  # ----------------------------------------------------------------------------
  # FastAPI + LangGraph Agentic AI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-enterprise_ai_ops}
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_secure_random_32_character_string_for_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MOCK_AI: ${MOCK_AI:-false}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIR: /app/data/uploads
      REPORTS_DIR: /app/data/reports
      MAX_UPLOAD_SIZE_MB: "15"
      SIMILARITY_THRESHOLD: "0.20"
      CHUNKS_PER_QUERY: "5"
    volumes:
      - uploads_data:/app/data/uploads
      - reports_data:/app/data/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - enterprise-net

  # ----------------------------------------------------------------------------
  # Next.js 14 Enterprise SaaS Frontend Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: enterprise-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge

volumes:
  pgdata:
    name: enterprise_ai_pgdata
  uploads_data:
    name: enterprise_ai_uploads
  reports_data:
    name: enterprise_ai_reports

